# uv workspace root (not itself a package).
[project]
name = "tracely-monorepo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=0.23",
  "ruff>=0.16.5",
  "tracely-ai[all]",
  "python-dotenv>=1.2.3",   # sdk/examples/* load .env so provider keys work without a manual export
  "aiosqlite>=0.20",      # hermetic async DB for the auth test suite (no Postgres required)
  "httpx>=0.27",          # ASGITransport test client for FastAPI auth endpoints
]

[tool.uv.workspace]
members = ["backend", "workers", "sdk"]

[tool.uv.sources]
tracely-backend = { workspace = true }
tracely-ai = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored agent-skill packs — third-party code we don't own and don't ship.
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
# Ruff 0.16 widened its *default* rule set, so a Dependabot patch bump (0.15 → 0.16, #97) turned on
# a dozen new rule families and painted the repo red with 465 findings nobody wrote. Pin the classic
# default explicitly: a lint-policy change should be a commit, never a side effect of a version bump.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# tracely.init() must run before importing the frameworks it instruments.
"demo/*.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
