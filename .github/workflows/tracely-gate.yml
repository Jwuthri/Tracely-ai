name: Tracely regression gate

# ⚠️ This is Tracely DOGFOODING ITSELF: it replays the bundled `weather_agent` example, hence the
# in-repo `pip install ./sdk` + `--entrypoint weather_agent:run`. It is NOT the template for your
# own agent. To gate YOUR agent, see README → "Gate your PRs (CI/CD)" and the reusable composite
# action at .github/actions/tracely-gate (uses: <repo>/.github/actions/tracely-gate@<ref>).
#
# What it does: gate every PR on the agent's regression suite — a PR that changes the agent must not
# reproduce any promoted production failure (fail-to-pass), or the check fails.
#
# 👉 Most teams want the action's default `mode: simulate` instead, which needs NO agent code in CI
#    — Tracely calls the HTTP endpoint you registered and drives multi-turn scenarios against it,
#    so it works for a TypeScript or Go service too. See docs/pages/scenarios.mdx. This repo can't
#    dogfood that: the example agent isn't deployed anywhere for CI to call.
#
#      - uses: <repo>/.github/actions/tracely-gate@<ref>
#        with:
#          api: ${{ secrets.TRACELY_API }}
#          key: ${{ secrets.TRACELY_KEY }}
#          # agent: support-agent,planner   ← a subset; omit it to gate every agent with scenarios

on:
  pull_request:

permissions:
  contents: read
  statuses: write        # post the tracely/regression-gate commit status (the blocking check)
  pull-requests: write   # upsert the results comment on the PR

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # `tracely replay` re-runs the agent on every promoted case's recorded input, emits the
      # ci traces, and gates the PR in one step — exits non-zero on FAIL and, inside Actions,
      # posts the commit status + PR comment. Swap weather_agent:run for your real agent
      # entrypoint (or use --cmd "..." for a non-Python agent). run_broken demos a FAIL.
      - name: Tracely replay + gate
        env:
          TRACELY_API: ${{ secrets.TRACELY_API }}
          TRACELY_KEY: ${{ secrets.TRACELY_KEY }}
          TRACELY_WEB_URL: ${{ secrets.TRACELY_WEB_URL }}
          PYTHONPATH: sdk/examples
        run: |
          # Same reason as the composite action: Dependabot and fork PRs get no secrets, so this
          # job cannot run there and must not paint them red.
          if [ -z "$TRACELY_API" ] || [ -z "$TRACELY_KEY" ]; then
            echo "::notice title=Tracely gate skipped::No TRACELY_API/TRACELY_KEY available (fork or Dependabot pull request)."
            exit 0
          fi
          pip install ./sdk
          tracely replay planner --entrypoint weather_agent:run
