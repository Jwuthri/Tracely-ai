[project]
name = "tracely-backend"
version = "0.1.0"
description = "Tracely backend: FastAPI API + shared domain (ingestion, ClickHouse, registry, OTLP mapping, Celery tasks)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13.5",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "greenlet>=3.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "clickhouse-connect>=0.7.16",
  "aiohttp>=3.9",
  "boto3>=1.34",
  "opentelemetry-proto>=1.25",
  "celery[redis]>=5.4",
  "structlog>=24.1",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.52.4",
  # LLM stack: every chat call goes through LangChain v1 `create_agent` on OpenRouter
  # (infrastructure/llm/provider.py); embeddings + clustering power failure intelligence
  "pgvector>=0.3",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "umap-learn>=0.5.5",
  "hdbscan>=0.8.38",
  "langgraph>=1.0",
  # Durable judge conversations: a sequential evaluator's chat with the model is a LangGraph
  # thread, checkpointed in Postgres, so turn 6 resumes the transcript turn 5 left behind even
  # though it is graded minutes later in a different Celery task.
  "langgraph-checkpoint-postgres>=2.0",
  "langchain>=1.3",
  "langchain-openai>=1.2",
  # AI Observability: the CallbackHandler wired into every create_agent call in provider.py
  # (posthog.ai.langchain) so judge/assistant/simulation LLM calls land in PostHog as sessions,
  # traces and generations. >=7 required: posthog.ai.langchain imports langchain.callbacks.base
  # unconditionally below that, which doesn't exist on langchain>=1.0 (moved to langchain_core).
  "posthog>=7",
  # auth & multi-tenancy: JWT sign/verify (HS256 local + RS256/JWKS Clerk), argon2 password hashing
  "pyjwt[crypto]>=2.8",
  "argon2-cffi>=23.1",
  # Fernet symmetric encryption for workspace-supplied secrets at rest (e.g. a project's own
  # OpenRouter key) — already pulled in transitively by pyjwt[crypto]; declared directly since we
  # import it ourselves now.
  "cryptography>=50.0.0",
  "httpx>=0.27",
  # MCP server mounted at /mcp (api/mcp_server.py) — lets an agent drive the workspace with
  # the same ingest key the SDK uses. Small, pure-Python, and already in the lock file.
  "mcp>=2.1.1",
  # Hosted-cloud billing (services/billing_service.py). Pure-Python and small; self-hosters
  # carry the wheel but the code paths are dead unless BILLING_ENABLED + Stripe keys are set.
  "stripe>=11",
  # Alert rule flows (domain/alerting): every user-authored string field is a Jinja template
  # rendered in a sandbox, and the `python_expression` step is one expression evaluated with an
  # allowlist instead of eval(). Both are user input from the browser, so neither runs unsandboxed.
  "jinja2>=3.1",
  "simpleeval>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracely"]
